<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 192" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer Container -->
  <rect x="1" y="1" width="918" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="24" y="27" class="font-mono" font-size="11" font-weight="700" fill="#059669" letter-spacing="0.8">
    ENTERPRISE CASE STUDIES // MEASURABLE FINOPS, SCALE &amp; M&amp;A IMPACT (GOOGLE PSO &amp; PRINCIPAL ARCHITECTURE)
  </text>
  <line x1="24" y1="39" x2="896" y2="39" stroke="#e2e8f0" stroke-width="1"/>

  <!-- KPI 1: -88% Cost -->
  <rect x="20" y="52" width="210" height="124" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="34" y="84" class="font-sans" font-size="26" font-weight="800" fill="#059669" letter-spacing="-0.5">
    -88% Cost
  </text>
  <text x="34" y="104" class="font-mono" font-size="10.5" font-weight="700" fill="#2563eb">
    DATABRICKS → BIGQUERY
  </text>
  <text x="34" y="124" class="font-sans" font-size="11.5" fill="#475569">
    Re-architected a Brazilian
  </text>
  <text x="34" y="140" class="font-sans" font-size="11.5" fill="#475569">
    Fintech Data Lake on GCP,
  </text>
  <text x="34" y="156" class="font-sans" font-size="11.5" fill="#475569">
    slashing TCO by 88%.
  </text>

  <!-- KPI 2: -57% FinOps -->
  <rect x="243" y="52" width="210" height="124" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="257" y="84" class="font-sans" font-size="26" font-weight="800" fill="#2563eb" letter-spacing="-0.5">
    -57% FinOps
  </text>
  <text x="257" y="104" class="font-mono" font-size="10.5" font-weight="700" fill="#7c3aed">
    SERVERLESS DATABRICKS
  </text>
  <text x="257" y="124" class="font-sans" font-size="11.5" fill="#475569">
    Cut cluster spend by 57% via
  </text>
  <text x="257" y="140" class="font-sans" font-size="11.5" fill="#475569">
