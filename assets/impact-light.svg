  </text>
  <text x="257" y="156" class="font-sans" font-size="11.5" fill="#475569">
    governance &amp; tuning.
  </text>

  <!-- KPI 3: 40+ TB Migration -->
  <rect x="466" y="52" width="210" height="124" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="84" class="font-sans" font-size="26" font-weight="800" fill="#7c3aed" letter-spacing="-0.5">
    40+ TB to GCP
  </text>
  <text x="480" y="104" class="font-mono" font-size="10.5" font-weight="700" fill="#d97706">
    HADOOP · ORACLE · GREENPLUM
  </text>
  <text x="480" y="124" class="font-sans" font-size="11.5" fill="#475569">
    Led a 4-project LatAm-scale
  </text>
  <text x="480" y="140" class="font-sans" font-size="11.5" fill="#475569">
    migration program + flagship
  </text>
  <text x="480" y="156" class="font-sans" font-size="11.5" fill="#475569">
    Google PSO engagements.
  </text>

  <!-- KPI 4: European M&A -->
  <rect x="689" y="52" width="211" height="124" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="703" y="84" class="font-sans" font-size="24" font-weight="800" fill="#d97706" letter-spacing="-0.5">
    M&amp;A Exit
  </text>
  <text x="703" y="104" class="font-mono" font-size="10.5" font-weight="700" fill="#059669">
    AMERICAS' #1 LIVESTOCK LAKE
  </text>
  <text x="703" y="124" class="font-sans" font-size="11.5" fill="#475569">
    Built greenfield AgTech Lake
  </text>
  <text x="703" y="140" class="font-sans" font-size="11.5" fill="#475569">
    (AWS → GCP), fueling acquisition
  </text>
  <text x="703" y="156" class="font-sans" font-size="11.5" fill="#475569">
    by a European group.
  </text>
