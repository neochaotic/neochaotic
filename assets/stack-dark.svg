  </text>
  <line x1="24" y1="40" x2="896" y2="40" stroke="#1e293b" stroke-width="1"/>

  <!-- Col 1: x=24, width=206 -->
  <rect x="24" y="54" width="206" height="108" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
  <text x="40" y="76" class="font-mono" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.4">
    SYSTEMS &amp; RUNTIMES
  </text>
  <text x="40" y="98" class="font-sans" font-size="12.5" font-weight="700" fill="#f8fafc">
