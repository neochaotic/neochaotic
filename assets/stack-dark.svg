<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 184" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#0c1322"/>
    </linearGradient>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer Frame: 920 x 184 | 24px padding | 4 cols x 206px + 3 x 16px gap = 872px -->
  <rect x="1" y="1" width="918" height="182" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <text x="24" y="28" class="font-mono" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.8">
