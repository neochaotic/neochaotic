  <!-- Col 3: x=468, width=206 -->
  <rect x="468" y="54" width="206" height="108" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
  <text x="484" y="76" class="font-mono" font-size="10" font-weight="700" fill="#34d399" letter-spacing="0.4">
