  </text>

  <!-- Col 2: x=246, width=206 -->
  <rect x="246" y="54" width="206" height="108" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
  <text x="262" y="76" class="font-mono" font-size="10" font-weight="700" fill="#fbbf24" letter-spacing="0.4">
