name: Refresh README timeline

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/timeline.js
      - scripts/readme-timeline.mjs

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Render timeline
        run: node scripts/readme-timeline.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/timeline-dark.svg assets/timeline-light.svg; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/timeline-dark.svg assets/timeline-light.svg
          git commit -m "Refresh README timeline"
          git push
